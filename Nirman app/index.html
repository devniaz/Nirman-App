    <script>
      (function() {
        try {
          let _fetch = window.fetch ? window.fetch.bind(window) : undefined;
          
          // Define writable fetch property or getter/setter on window
          Object.defineProperty(window, 'fetch', {
            get() {
              return _fetch;
            },
            set(newFetch) {
              _fetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });

          // Also patch Window.prototype if needed
          if (window.Window && window.Window.prototype) {
            try {
              const protoDesc = Object.getOwnPropertyDescriptor(window.Window.prototype, 'fetch');
              if (protoDesc && !protoDesc.set) {
                Object.defineProperty(window.Window.prototype, 'fetch', {
                  get() {
                    return _fetch;
                  },
                  set(newFetch) {
                    _fetch = newFetch;
                  },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (e) {}
          }
        } catch (err) {}
      })();
    </script>
